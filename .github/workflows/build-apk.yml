name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed to publish releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count, which needs
          # more than the single commit a shallow clone gives.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ folder is generated by the toolchain rather than checked
      # in, so it always matches whatever Flutter version the runner has.
      # Works whether the app files sit at the repo root or one folder down,
      # so an extra nested folder from the upload is not a problem.
      - name: Find the app files
        id: src
        run: |
          if [ -f pubspec.yaml ]; then
            DIR=.
          else
            FOUND=$(find . -maxdepth 3 -name pubspec.yaml | head -1)
            if [ -z "$FOUND" ]; then
              echo "No pubspec.yaml found. Repository contents:"
              ls -R . | head -50
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          echo "Using $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          # The version name comes from pubspec and only moves when you move
          # it. The build number is the commit count, so it rises on every
          # push. Android compares build numbers, and anything watching the
          # releases for updates compares the file name, so both need to
          # change or a new build looks identical to the last one.
          V=$(grep -m1 '^version:' "$DIR/pubspec.yaml" | sed 's/version: *//' | cut -d'+' -f1)
          BUILD=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "version=$V"
          echo "build=$BUILD"
          echo "sha=$SHA"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Scaffold the Android project
        run: |
          # --org sets the Android application ID, here com.kreedah.workout_log.
          # That string is the app's identity to Android: changing it makes a
          # different app, side by side with the old one and unable to update
          # it. It is also permanent once published anywhere.
          flutter create --org com.kreedah --project-name workout_log --platforms=android /tmp/app
          rm -rf /tmp/app/lib /tmp/app/test
          # The generated lint config points at a package this project does
          # not depend on, which produces a warning on every run.
          rm -f /tmp/app/analysis_options.yaml
          DIR='${{ steps.src.outputs.dir }}'
          cp -r "$DIR/lib" "$DIR/assets" "$DIR/docs" "$DIR/pubspec.yaml" /tmp/app/
          # Source we do keep for the Android side, copied over the generated
          # tree. Currently MainActivity.kt, which carries the folder-picking
          # bridge. Everything else under android/ stays generated.
          cp -r "$DIR/platform/android/." /tmp/app/android/
          find /tmp/app/android -name 'MainActivity.kt'
          # Point the manifest at the string resource rather than writing the
          # name in here. Keeps the display name in source, and keeps macrons
          # away from shell escaping.
          sed -i 's|android:label="workout_log"|android:label="@string/app_name"|' \
            /tmp/app/android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' /tmp/app/android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        working-directory: /tmp/app
        run: flutter pub get

      # Generates the launcher icons into the scaffolded android/ folder,
      # including the adaptive-icon layers. Must run after `flutter create`
      # and before the build.
      - name: Launcher icon
        working-directory: /tmp/app
        run: dart run flutter_launcher_icons

      # Runs first so compile errors show up as readable analyzer output
      # instead of a wall of Gradle noise.
      - name: Analyze
        working-directory: /tmp/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # One APK per CPU architecture instead of a fat binary carrying all of
      # them. Roughly halves the download; install the arm64-v8a one.
      - name: Build release APK
        working-directory: /tmp/app
        run: |
          flutter build apk --release --split-per-abi \
            --build-name='${{ steps.src.outputs.version }}' \
            --build-number='${{ steps.src.outputs.build }}'

      - name: Sizes
        run: ls -lh /tmp/app/build/app/outputs/flutter-apk/*.apk

      # Re-signs the APKs with the permanent key so every build shares one
      # identity and updates install over the top instead of demanding an
      # uninstall. Runs on the built artefact rather than patching Gradle,
      # which keeps it independent of Flutter's generated build files.
      - name: Sign with the permanent key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets set. See docs/SIGNING-SETUP.md."
            echo "Builds would stay debug-signed and updates would need an uninstall."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/wlog.jks
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          for f in /tmp/app/build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" sign --ks /tmp/wlog.jks --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS "$f"
            "$APKSIGNER" verify --print-certs "$f" | grep -i "SHA-256" | head -1
          done

      # Give the files a name that says what they are and which build they
      # came from. app-arm64-v8a-release.apk tells a stranger nothing, and a
      # name that never changes makes two different builds indistinguishable
      # in a downloads folder.
      - name: Name the builds
        id: ver
        run: |
          V='${{ steps.src.outputs.version }}'
          BUILD='${{ steps.src.outputs.build }}'
          mkdir -p /tmp/out
          for f in /tmp/app/build/app/outputs/flutter-apk/*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "/tmp/out/wlog-$V-b$BUILD-$abi.apk"
          done
          ls -lh /tmp/out

      # A rolling release on a fixed tag, so there is one permanent link that
      # always points at the current build and can be opened on the phone
      # without signing in. Actions artifacts need a login and expire.
      #
      # Pushes usually carry several commits, so the notes list all of them
      # rather than only the last. github.event.before is the tip before this
      # push, and is all zeroes the first time a branch is pushed.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          V='${{ steps.src.outputs.version }}'
          BUILD='${{ steps.src.outputs.build }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            LOG=$(git log -8 --pretty='- %s')
          else
            LOG=$(git log --pretty='- %s' "$BEFORE..${GITHUB_SHA}")
          fi
          [ -z "$LOG" ] && LOG='- no new commits'

          cat > /tmp/notes.md <<EOF
          Install **wlog-$V-b$BUILD-arm64-v8a.apk** unless you know your phone needs another architecture.

          Signed with the project key, so it installs over the previous build and keeps your data.

          ### In this build

          $LOG

          Built from \`main\` at \`${{ steps.src.outputs.sha }}\`.
          EOF

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest /tmp/out/*.apk \
            --title "Build $BUILD ($V)" \
            --prerelease \
            --notes-file /tmp/notes.md

      # A permanent, versioned release when a tag is pushed.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/out/*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: workout-log-apk
          path: /tmp/out/*.apk
          if-no-files-found: error
